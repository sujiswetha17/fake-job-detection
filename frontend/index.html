<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fake Job Detection System</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="container">

        <h1>Fake Job Detection System</h1>

        <p class="subtitle">
            AI-powered detection of suspicious job postings
        </p>


        <!-- ========================= -->
        <!-- MANUAL JOB ANALYSIS -->
        <!-- ========================= -->

        <section class="card">

            <h2>Manual Job Analysis</h2>


            <label for="job_title">
                Job Title
            </label>

            <input
                type="text"
                id="job_title"
                placeholder="Example: Software Developer"
            >


            <label for="company">
                Company
            </label>

            <input
                type="text"
                id="company"
                placeholder="Example: ABC Technologies"
            >


            <label for="location">
                Location
            </label>

            <input
                type="text"
                id="location"
                placeholder="Example: Chennai"
            >


            <label for="salary">
                Salary
            </label>

            <input
                type="number"
                id="salary"
                placeholder="Example: 50000"
            >


            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                placeholder="Paste the job description here..."
            ></textarea>


            <button
                onclick="analyzeJob()"
            >
                Analyze Job
            </button>

        </section>



        <!-- ========================= -->
        <!-- IMAGE OCR ANALYSIS -->
        <!-- ========================= -->

        <section class="card">

            <h2>
                Analyze Job Screenshot
            </h2>


            <p>
                Upload a screenshot or image
                of a job advertisement.
            </p>


            <input
                type="file"
                id="imageFile"
                accept=".jpg,.jpeg,.png,.webp"
            >


            <button
                onclick="analyzeImage()"
            >
                Upload & Analyze Image
            </button>

        </section>



        <!-- ========================= -->
        <!-- RESULT -->
        <!-- ========================= -->

        <section
            id="result"
            class="result-card"
        >

            <p>
                Your analysis result will appear here.
            </p>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
